    <g transform="rotate(30 100 100)"><rect x="93" y="12" width="14" height="22" rx="6" fill="#ff5722"/></g>
    <g transform="rotate(60 100 100)"><rect x="92" y="6" width="16" height="30" rx="7" fill="#ff7043"/></g>
    <g transform="rotate(90 100 100)"><rect x="93" y="12" width="14" height="22" rx="6" fill="#fb8c00"/></g>
    <g transform="rotate(120 100 100)"><rect x="92" y="6" width="16" height="30" rx="7" fill="#ffa726"/></g>
    <g transform="rotate(150 100 100)"><rect x="93" y="12" width="14" height="22" rx="6" fill="#fbc02d"/></g>
    <g transform="rotate(180 100 100)"><rect x="92" y="6" width="16" height="30" rx="7" fill="#fbc02d"/></g>
    <g transform="rotate(210 100 100)"><rect x="93" y="12" width="14" height="22" rx="6" fill="#ffa726"/></g>
    <g transform="rotate(240 100 100)"><rect x="92" y="6" width="16" height="30" rx="7" fill="#fb8c00"/></g>
    <g transform="rotate(270 100 100)"><rect x="93" y="12" width="14" height="22" rx="6" fill="#ff7043"/></g>
    <g transform="rotate(300 100 100)"><rect x="92" y="6" width="16" height="30" rx="7" fill="#ff5722"/></g>
    <g transform="rotate(330 100 100)"><rect x="93" y="12" width="14" height="22" rx="6" fill="#f4511e"/></g>
  </g>
  <!-- Cuerpo en espiral: círculos desplazados formando crecientes -->
  <circle cx="100" cy="100" r="58" fill="url(#gSol)"/>
  <circle cx="112" cy="88" r="47" fill="#ffffff"/>
  <circle cx="105" cy="95" r="38" fill="url(#gSol2)"/>
  <circle cx="100" cy="100" r="21" fill="#ffffff"/>

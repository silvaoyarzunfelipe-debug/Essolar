<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ESSOLAR">
  <defs>
    <linearGradient id="gSol" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4511e"/>
      <stop offset="1" stop-color="#ffa726"/>
    </linearGradient>
    <linearGradient id="gSol2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7043"/>
      <stop offset="1" stop-color="#fb8c00"/>
    </linearGradient>
  </defs>
  <!-- Rayos: largos y cortos alternados, rojizos arriba, amarillos abajo -->

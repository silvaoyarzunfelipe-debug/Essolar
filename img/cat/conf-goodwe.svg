<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Inversor GoodWe con garantía de fábrica">
  <defs>
    <linearGradient id="fC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef2f7"/><stop offset="1" stop-color="#dae2ec"/></linearGradient>
    <linearGradient id="eqC" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#f2f6fa"/><stop offset="1" stop-color="#ccd6e0"/></linearGradient>
    <filter id="sC" x="-25%" y="-25%" width="160%" height="160%"><feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#0b2540" flood-opacity="0.26"/></filter>
  </defs>
  <rect width="400" height="300" fill="url(#fC)"/>
  <rect y="248" width="400" height="52" fill="#c3ccd6" opacity="0.55"/>
  <!-- inversor -->
  <g filter="url(#sC)">
    <rect x="66" y="52" width="150" height="198" rx="14" fill="url(#eqC)" stroke="#aab7c4" stroke-width="2.5"/>
    <rect x="88" y="78" width="106" height="62" rx="6" fill="#0e2a45" stroke="#2b4f7e" stroke-width="2"/>
    <text x="141" y="106" text-anchor="middle" fill="#4cc46f" font-size="17" font-weight="700" font-family="Arial, sans-serif">6.0 kW</text>
    <text x="141" y="126" text-anchor="middle" fill="#8fb3d4" font-size="10" font-family="Arial, sans-serif">HÍBRIDO</text>
    <circle cx="102" cy="164" r="6" fill="#4cc46f"/><circle cx="124" cy="164" r="6" fill="#f5a623"/><circle cx="146" cy="164" r="6" fill="#c3ccd6"/>
    <g fill="#bcc7d4"><rect x="88" y="186" width="106" height="5" rx="2.5"/><rect x="88" y="198" width="106" height="5" rx="2.5"/><rect x="88" y="210" width="106" height="5" rx="2.5"/></g>
    <rect x="88" y="226" width="60" height="14" rx="4" fill="#dfe6ed"/>
  </g>
  <!-- sello garantía -->
  <g filter="url(#sC)">
    <circle cx="300" cy="132" r="66" fill="#f5a623" stroke="#e08c00" stroke-width="4"/>
    <circle cx="300" cy="132" r="54" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>
    <text x="300" y="122" text-anchor="middle" fill="#0b2540" font-size="34" font-weight="800" font-family="Arial, sans-serif">10</text>
    <text x="300" y="146" text-anchor="middle" fill="#0b2540" font-size="14" font-weight="800" font-family="Arial, sans-serif">AÑOS</text>
    <text x="300" y="166" text-anchor="middle" fill="#7a5200" font-size="10" font-weight="700" letter-spacing="1" font-family="Arial, sans-serif">GARANTÍA</text>
  </g>
  <text x="300" y="228" text-anchor="middle" fill="#14406b" font-size="15" font-weight="800" letter-spacing="2" font-family="Arial, sans-serif">GoodWe</text>
  <text x="300" y="248" text-anchor="middle" fill="#55637a" font-size="10" font-weight="600" font-family="Arial, sans-serif">Equipos originales</text>

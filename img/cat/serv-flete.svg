<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Paneles paletizados listos para despacho">
  <defs>
    <linearGradient id="fondoF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2f7"/><stop offset="1" stop-color="#dbe3ec"/>
    </linearGradient>
    <linearGradient id="pisoF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2cbd6"/><stop offset="1" stop-color="#9ba7b5"/>
    </linearGradient>
    <linearGradient id="cajaF" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9a05f"/><stop offset="0.6" stop-color="#c1863f"/><stop offset="1" stop-color="#a06e31"/>
    </linearGradient>
    <linearGradient id="panelF" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22456d"/><stop offset="1" stop-color="#122b47"/>
    </linearGradient>
    <linearGradient id="camionF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dde4ec"/>
    </linearGradient>
    <filter id="shF" x="-25%" y="-25%" width="160%" height="160%">
      <feDropShadow dx="5" dy="8" stdDeviation="8" flood-color="#0b2540" flood-opacity="0.26"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#fondoF)"/>
  <!-- galpón: líneas de fondo -->
  <g stroke="#c8d1db" stroke-width="3" opacity="0.8">
    <line x1="0" y1="70" x2="600" y2="70"/><line x1="0" y1="110" x2="600" y2="110"/>
  </g>
  <rect y="300" width="600" height="100" fill="url(#pisoF)"/>
  <rect y="296" width="600" height="5" fill="#8d99a8"/>

  <!-- camión (fondo, derecha) -->
  <g opacity="0.95">
    <rect x="392" y="150" width="188" height="120" rx="8" fill="url(#camionF)" stroke="#aab6c4" stroke-width="2.5"/>
    <rect x="404" y="164" width="72" height="46" rx="4" fill="#e6ecf3" stroke="#bcc7d4" stroke-width="2"/>
    <rect x="488" y="164" width="72" height="46" rx="4" fill="#e6ecf3" stroke="#bcc7d4" stroke-width="2"/>
    <rect x="392" y="256" width="188" height="14" fill="#c4cedb"/>
    <circle cx="440" cy="288" r="22" fill="#2f3a45"/><circle cx="440" cy="288" r="9" fill="#8d99a8"/>
    <circle cx="536" cy="288" r="22" fill="#2f3a45"/><circle cx="536" cy="288" r="9" fill="#8d99a8"/>
  </g>

  <!-- pallet con paneles (protagonista) -->
  <g filter="url(#shF)">
    <!-- carga de paneles apilados -->
    <g>
      <rect x="72" y="120" width="230" height="24" rx="3" fill="url(#panelF)" stroke="#4a7fb5" stroke-width="2"/>
      <rect x="72" y="148" width="230" height="24" rx="3" fill="url(#panelF)" stroke="#4a7fb5" stroke-width="2"/>
      <rect x="72" y="176" width="230" height="24" rx="3" fill="url(#panelF)" stroke="#4a7fb5" stroke-width="2"/>
      <rect x="72" y="204" width="230" height="24" rx="3" fill="url(#panelF)" stroke="#4a7fb5" stroke-width="2"/>
      <rect x="72" y="232" width="230" height="24" rx="3" fill="url(#panelF)" stroke="#4a7fb5" stroke-width="2"/>
    </g>
    <!-- film de embalaje -->
    <rect x="66" y="114" width="242" height="148" rx="6" fill="#ffffff" opacity="0.20"/>
    <g stroke="#ffffff" stroke-width="3" opacity="0.55">
      <line x1="66" y1="140" x2="308" y2="152"/><line x1="66" y1="190" x2="308" y2="202"/>
      <line x1="66" y1="240" x2="308" y2="250"/>
    </g>
    <!-- zunchos -->
    <g fill="#f5a623">
      <rect x="112" y="112" width="10" height="152" rx="2"/>
      <rect x="252" y="112" width="10" height="152" rx="2"/>
    </g>
    <!-- pallet de madera -->
    <g>
      <rect x="60" y="264" width="254" height="14" fill="url(#cajaF)" stroke="#8f6229" stroke-width="1.5"/>
      <rect x="60" y="282" width="254" height="12" fill="#a97a3c" stroke="#8f6229" stroke-width="1.5"/>
      <rect x="72" y="278" width="22" height="6" fill="#8f6229"/>
      <rect x="176" y="278" width="22" height="6" fill="#8f6229"/>
      <rect x="280" y="278" width="22" height="6" fill="#8f6229"/>
    </g>
    <!-- etiqueta frágil -->
    <g>
      <rect x="196" y="166" width="94" height="46" rx="5" fill="#ffffff" stroke="#c3ccd6" stroke-width="2"/>
      <text x="243" y="185" text-anchor="middle" fill="#e04a2f" font-size="13" font-weight="800" font-family="Arial, sans-serif">FRÁGIL</text>
      <text x="243" y="202" text-anchor="middle" fill="#55637a" font-size="10" font-weight="600" font-family="Arial, sans-serif">ESOLAR</text>
    </g>
  </g>

  <!-- caja de accesorios -->
  <g filter="url(#shF)">
    <rect x="330" y="228" width="70" height="62" rx="4" fill="url(#cajaF)" stroke="#8f6229" stroke-width="2"/>
    <line x1="365" y1="228" x2="365" y2="290" stroke="#8f6229" stroke-width="2.5"/>
    <rect x="336" y="244" width="58" height="12" rx="2" fill="#e8d5b4" opacity="0.8"/>
  </g>
</svg>
